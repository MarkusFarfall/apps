name: Import Water release source

on:
  push:
    branches:
      - arena/01a0ee74-apps
    paths:
      - .github/workflows/import-water-release.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and safely unpack the private release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/water-release projects/water-import
          gh release download Tqgq --repo MarkusFarfall/apps --pattern 'waterrs.2.zip' --dir /tmp/water-release
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('/tmp/water-release/waterrs.2.zip')
          target = Path('projects/water-import').resolve()
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = PurePosixPath(info.filename)
                  if name.is_absolute() or '..' in name.parts:
                      raise SystemExit(f'Unsafe archive path: {info.filename!r}')
                  dest = (target / Path(*name.parts)).resolve()
                  if target not in dest.parents and dest != target:
                      raise SystemExit(f'Unsafe archive path: {info.filename!r}')
              zf.extractall(target)
          print('Extracted archive entries:')
          for p in sorted(target.rglob('*')):
              if p.is_file(): print(p.relative_to(target), p.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/water-import
          git commit -m 'chore: import Water release source for setup'
          git push origin "HEAD:${GITHUB_REF_NAME}"
